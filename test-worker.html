<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تستِ Worker</title>
<style>
  body{ font-family: Tahoma, sans-serif; padding:16px; background:#f0f4f0; }
  button{ font-size:16px; padding:12px 20px; background:#1a6b3c; color:#fff; border:none; border-radius:8px; width:100%; margin-bottom:12px; }
  pre{ background:#fff; border:1px solid #ccc; border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-all; font-size:13px; }
  .label{ font-weight:bold; margin-top:16px; }
</style>
</head>
<body>
<h2>تستِ مستقیمِ Worker (بدون هدرِ سفارشی)</h2>
<button onclick="runTest()">🔍 تست کن</button>
<div class="label">نتیجه:</div>
<pre id="out">هنوز تست نشده...</pre>

<script>
const TG_PROXY_URL = 'https://qanat-telegram-proxy.hoseinbagheri99.workers.dev';
const TG_PROXY_SECRET = 'idp-23bSnu5b2jPr9SJyeUp8hJqaAdmv9NSFR5ebJSQ';
const TELEGRAM_CHAT_ID = '124757927';

async function runTest(){
  const out = document.getElementById('out');
  out.textContent = 'در حال ارسال...';
  try{
    const form = new FormData();
    form.append('chat_id', TELEGRAM_CHAT_ID);
    form.append('text', '✅ این یه پیامِ تستیِ جدید بود (بدون هدر).');
    const res = await fetch(`${TG_PROXY_URL}/?method=sendMessage&secret=${encodeURIComponent(TG_PROXY_SECRET)}`, {
      method: 'POST',
      body: form,
    });
    const text = await res.text();
    out.textContent = `HTTP Status: ${res.status}\n\nپاسخ:\n${text}`;
  }catch(e){
    out.textContent = `❌ خطا:\n${e.name}: ${e.message}\n\n${e.stack || ''}`;
  }
}
</script>
</body>
</html>
